server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fakenews}
    username: ${DB_USERNAME:fakenews}
    password: ${DB_PASSWORD:?DB_PASSWORD must be supplied}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  jwt-secret: ${JWT_SECRET:?JWT_SECRET must be supplied}
  jwt-expiration: 7d
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  ml-service-token: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN must be supplied}
  live-news-rss-url: ${NEWS_RSS_URL:https://feeds.bbci.co.uk/news/rss.xml}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
