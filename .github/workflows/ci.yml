name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  spring:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: spring-backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn --batch-mode verify
  ml:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: python-ml-service}}
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -m nltk.downloader stopwords wordnet omw-1.4
      - name: Test ML service without generating model artifacts
        run: |
          if [ -s ../python-ml-service/artifacts/model.pkl ] && [ -s ../python-ml-service/artifacts/vectorizer.pkl ]; then
            pytest
          else
            echo "Existing model artifacts are external; running artifact-independent tests only."
            pytest tests/test_preprocessing.py tests/test_api.py \
              -k "not saved_model_and_vectorizer_have_compatible_features and not training_vectorizer_configuration_matches_saved_vectorizer and not health_reports_loaded_ml_service and not predict_returns_actual_response_contract"
          fi
